<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ bot_name }}</title>
  <link rel="icon" href="/static/icon.svg?v={{ v }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
  <script src="/static/theme.js?v={{ v }}"></script>
  <script type="module" src="/static/app.js?v={{ v }}"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="nav.skip">Перейти к содержимому</a>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">{{ bot_name }}</span>
      </div>
      <nav class="nav" aria-label="Разделы" data-i18n-aria="nav.label">
        <div class="nav-list" role="tablist" aria-orientation="vertical" id="nav"></div>
      </nav>
    </aside>
    <div class="stage">
      <header class="topbar">
        <div class="status" id="bot-status" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text"></span>
          <span class="status-tasks"></span>
        </div>
        <div class="topbar-tools">
          <button type="button" class="ghost" id="lang-toggle"></button>
          <button type="button" class="ghost" id="theme-toggle"></button>
          <button type="button" class="ghost" id="logout"></button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript><p class="noscript">JavaScript is required.</p></noscript>
</body>
</html>
