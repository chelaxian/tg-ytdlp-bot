<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ bot_name }}</title>
  <link rel="icon" href="/static/icon.svg?v={{ v }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
  <script src="/static/theme.js?v={{ v }}"></script>
  <script type="module" src="/static/login.js?v={{ v }}"></script>
</head>
<body class="login-page">
  <main class="login">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name" id="bot-name">{{ bot_name }}</span>
    </div>
    <form class="login-form" id="login-form" novalidate>
      <h1 data-i18n="login.title">Вход в панель</h1>
      <label class="field">
        <span data-i18n="login.user">Логин</span>
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="128">
      </label>
      <label class="field">
        <span data-i18n="login.password">Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required maxlength="256">
      </label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="primary wide" id="login-submit" data-i18n="login.submit">Войти</button>
    </form>
    <button type="button" class="ghost lang-switch" id="lang-toggle"></button>
  </main>
</body>
</html>
